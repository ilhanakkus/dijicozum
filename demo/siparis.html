<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restoran QR menü ve sipariş örneği | DijiÇözüm</title>
<meta name="description" content="Çalışan bir QR menü ve online sipariş örneği. Sepete ürün ekleyin, siparişi verin, mutfak ekranında görün.">
<link rel="canonical" href="https://dijicozum.com/demo/siparis">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap&subset=latin-ext" rel="stylesheet">
<link rel="stylesheet" href="../assets/demo.css">
<style>
  :root { --bg:#fff7f0; --ink:#2b1a12; --red:#c8321e; --red-soft:#fde6e0; --line:#efdfd3; --card:#fff; --muted:#7d6a5e; --ok:#1c7c4b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Plus Jakarta Sans",system-ui,sans-serif; background:#f0e6dc; color:var(--ink); line-height:1.45; }
  button { font:inherit; cursor:pointer; }
  .seg { display:flex; justify-content:center; gap:6px; padding:14px 12px 0; }
  .seg button { border:0; background:transparent; padding:10px 18px; border-radius:999px; font-weight:700; color:var(--muted); }
  .seg button.on { background:var(--ink); color:#fff; }
  .hint { max-width:460px; margin:12px auto 0; padding:0 16px; font-size:13.5px; color:var(--muted); text-align:center; }
  /* Telefon */
  .phone { max-width:440px; margin:14px auto 40px; background:var(--bg); min-height:680px; border-radius:28px; overflow:hidden; box-shadow:0 30px 60px -20px rgba(43,26,18,.35); position:relative; padding-bottom:90px; }
  .hd { background:var(--red); color:#fff; padding:22px 20px 18px; }
  .hd h1 { font-size:22px; letter-spacing:-.01em; } .hd p { opacity:.9; font-size:13.5px; }
  .meta { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .meta select, .meta .chip { border:0; border-radius:999px; padding:7px 12px; font:700 13px "Plus Jakarta Sans",system-ui,sans-serif; background:rgba(255,255,255,.2); color:#fff; }
  .meta select option { color:#000; }
  .cats { display:flex; gap:8px; overflow-x:auto; padding:14px 16px; position:sticky; top:44px; background:var(--bg); z-index:5; border-bottom:1px solid var(--line); }
  .cat { flex:none; border:1.5px solid var(--line); background:#fff; padding:8px 16px; border-radius:999px; font-weight:700; font-size:14px; }
  .cat.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .menu { padding:8px 16px; }
  .menu h2 { font-size:17px; margin:18px 0 8px; }
  .item { display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); align-items:center; }
  .pic { flex:none; width:68px; height:68px; border-radius:16px; display:grid; place-items:center; font-size:34px; background:var(--red-soft); }
  .info { flex:1; min-width:0; } .info b { display:block; font-size:15.5px; } .info small { color:var(--muted); display:block; font-size:12.5px; margin:1px 0 4px; }
  .price { font-weight:800; }
  .qty { display:flex; align-items:center; gap:10px; }
  .qty button { width:32px; height:32px; border-radius:50%; border:0; background:var(--red); color:#fff; font-size:18px; font-weight:800; line-height:1; }
  .qty button.minus { background:#f2e3d9; color:var(--ink); }
  .qty span { min-width:14px; text-align:center; font-weight:800; }
  .add { border:2px solid var(--red); color:var(--red); background:#fff; border-radius:999px; padding:6px 16px; font-weight:800; font-size:14px; }
  .cartbar { position:sticky; bottom:14px; margin:0 14px; }
  .cartbtn { width:100%; border:0; background:var(--ink); color:#fff; border-radius:16px; padding:15px 18px; display:flex; justify-content:space-between; font-weight:800; font-size:16px; box-shadow:0 14px 30px -10px rgba(0,0,0,.5); }
  /* sheet */
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2000; display:none; align-items:flex-end; justify-content:center; }
  .sheet-bg.open { display:flex; }
  .sheet { background:#fff; width:min(440px,100%); border-radius:24px 24px 0 0; padding:22px 20px 26px; max-height:88vh; overflow:auto; }
  .sheet h3 { font-size:20px; margin-bottom:12px; }
  .line { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .tot { display:flex; justify-content:space-between; font-weight:800; font-size:19px; padding:14px 0; }
  .sheet textarea { width:100%; font:inherit; border:2px solid var(--line); border-radius:12px; padding:10px 12px; margin:10px 0; resize:none; }
  .pay { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  .pay button { border:2px solid var(--line); background:#fff; border-radius:12px; padding:12px 6px; font-weight:700; font-size:14px; }
  .pay button.on { border-color:var(--red); background:var(--red-soft); }
  .go { width:100%; border:0; border-radius:14px; padding:16px; background:var(--red); color:#fff; font-weight:800; font-size:17px; }
  .close { float:right; border:0; background:#f2e3d9; width:34px; height:34px; border-radius:50%; font-size:18px; }
  /* takip */
  .track { padding:26px 20px; text-align:center; }
  .track .big { font-size:54px; }
  .prog { display:flex; justify-content:space-between; margin:26px 0 8px; position:relative; }
  .prog::before { content:""; position:absolute; left:8%; right:8%; top:15px; height:4px; background:var(--line); }
  .pg { position:relative; text-align:center; flex:1; font-size:13px; font-weight:700; color:var(--muted); }
  .pg i { display:block; width:34px; height:34px; border-radius:50%; background:#fff; border:3px solid var(--line); margin:0 auto 6px; font-style:normal; line-height:28px; }
  .pg.done i { background:var(--ok); border-color:var(--ok); color:#fff; } .pg.done { color:var(--ink); }
  .pg.now i { border-color:var(--red); color:var(--red); }
  /* mutfak */
  .kitchen { max-width:1000px; margin:14px auto 40px; padding:0 14px; }
  .cols { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .col { background:#e7dbcf; border-radius:18px; padding:14px; min-height:340px; }
  .col h3 { font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; }
  .ord { background:#fff; border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:0 2px 6px rgba(0,0,0,.06); }
  .ord .top { display:flex; justify-content:space-between; font-weight:800; margin-bottom:6px; }
  .ord ul { list-style:none; font-size:14.5px; } .ord li { padding:2px 0; }
  .ord .note { font-size:12.5px; background:#fff3c4; padding:6px 8px; border-radius:8px; margin-top:8px; }
  .ord .tag { font-size:12px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--red-soft); color:var(--red); }
  .ord button { margin-top:10px; width:100%; border:0; background:var(--ink); color:#fff; padding:10px; border-radius:10px; font-weight:700; }
  .emptyc { color:var(--muted); font-size:14px; text-align:center; padding:26px 0; }
  .reset { display:block; margin:0 auto; background:none; border:0; text-decoration:underline; color:var(--muted); font-size:13px; }
  @media (max-width:820px) { .cols { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="seg">
  <button class="on" data-v="musteri">Müşterinin telefonu</button>
  <button data-v="mutfak">Mutfak ekranı</button>
</div>

<!-- MÜŞTERİ -->
<div id="musteri">
  <p class="hint"><strong>Deneyin:</strong> sepete ürün ekleyip siparişi gönderin. Sonra "Mutfak ekranı"na geçip siparişi hazırlayın, durumun müşteri ekranında değiştiğini görün.</p>
  <div class="phone" id="phone"></div>
</div>

<!-- MUTFAK -->
<div id="mutfak" hidden>
  <p class="hint">Restoranın mutfak ekranı: sipariş anında düşer, tek tuşla ilerletilir. Ekran sesli uyarı ve yazıcı çıktısıyla da çalışabilir.</p>
  <div class="kitchen">
    <div class="cols" id="cols"></div>
    <button class="reset" id="reset" style="margin-top:18px">Demo siparişlerini temizle</button>
  </div>
</div>

<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>

<script src="../assets/config.js"></script>
<script src="../assets/demo.js"></script>
<script>
const MENU = [
  { cat:'Ana yemek', items:[
    { id:1, ad:'Adana dürüm', ac:'Acılı kıyma, közlenmiş biber, sumaklı soğan', f:185, e:'🌯' },
    { id:2, ad:'Karışık ızgara', ac:'Kuzu pirzola, köfte, tavuk şiş, pilav', f:340, e:'🍖' },
    { id:3, ad:'Tavuk şiş', ac:'Marine tavuk, bulgur pilavı, közlenmiş domates', f:220, e:'🍢' },
    { id:4, ad:'Mantı', ac:'El açması, yoğurt ve tereyağlı sos', f:210, e:'🥟' } ]},
  { cat:'Çorba ve başlangıç', items:[
    { id:5, ad:'Mercimek çorbası', ac:'Günün çorbası, limon ve ekmek ile', f:80, e:'🍲' },
    { id:6, ad:'Karışık meze tabağı', ac:'Haydari, ezme, humus, acılı ezme', f:150, e:'🥗' },
    { id:7, ad:'Sigara böreği (4 adet)', ac:'Beyaz peynirli, çıtır', f:120, e:'🥐' } ]},
  { cat:'İçecek', items:[
    { id:8, ad:'Ayran', ac:'Bakır kasede, köpüklü', f:35, e:'🥛' },
    { id:9, ad:'Türk çayı', ac:'İnce belli bardakta', f:20, e:'🍵' },
    { id:10, ad:'Limonata', ac:'Ev yapımı, naneli', f:60, e:'🍋' } ]},
  { cat:'Tatlı', items:[
    { id:11, ad:'Künefe', ac:'Sıcak servis, antep fıstıklı', f:170, e:'🍮' },
    { id:12, ad:'Sütlaç', ac:'Fırında, ev usulü', f:110, e:'🍚' } ]},
];
const ALL = MENU.flatMap(c=>c.items);
const TL = n => '₺' + n.toLocaleString('tr-TR');
const KEY = 'demo_siparis_v1';
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } };
const save = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} };
let orders = load();
let cart = {}; let mode = 'Masada (Masa 7)'; let pay = 'Masada öde'; let note = ''; let myOrder = null; let cat = 0;
const count = () => Object.values(cart).reduce((a,b)=>a+b,0);
const total = () => Object.entries(cart).reduce((a,[id,q])=>a+ALL.find(x=>x.id==id).f*q,0);

const phone = document.getElementById('phone');
function renderPhone() {
  if (myOrder) return renderTrack();
  let h = '<div class="hd"><h1>Lokanta Sofra</h1><p>Beşiktaş · Her gün 11:00–23:00</p><div class="meta"><span class="chip">🍽️ Masa 7 (QR ile okutuldu)</span>' +
    '<select id="mode"><option>Masada (Masa 7)</option><option>Gel-al</option><option>Paket servis</option></select></div></div>';
  h += '<div class="cats">' + MENU.map((c,i)=>'<button class="cat '+(i===cat?'on':'')+'" data-cat="'+i+'">'+c.cat+'</button>').join('') + '</div>';
  h += '<div class="menu">' + MENU.map((c,i)=>'<div id="c'+i+'"><h2>'+c.cat+'</h2>' + c.items.map(it => {
    const q = cart[it.id]||0;
    return '<div class="item"><div class="pic">'+it.e+'</div><div class="info"><b>'+it.ad+'</b><small>'+it.ac+'</small><span class="price">'+TL(it.f)+'</span></div>' +
      (q ? '<div class="qty"><button class="minus" data-m="'+it.id+'">−</button><span>'+q+'</span><button data-p="'+it.id+'">+</button></div>' : '<button class="add" data-p="'+it.id+'">Ekle</button>') + '</div>'; }).join('') + '</div>').join('') + '</div>';
  if (count()) h += '<div class="cartbar"><button class="cartbtn" id="opencart"><span>🛒 Sepeti gör ('+count()+')</span><span>'+TL(total())+'</span></button></div>';
  phone.innerHTML = h;
  const sel = document.getElementById('mode'); sel.value = mode; sel.onchange = () => mode = sel.value;
}
phone.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p) cart[b.dataset.p] = (cart[b.dataset.p]||0)+1;
  else if (b.dataset.m) { cart[b.dataset.m]--; if (!cart[b.dataset.m]) delete cart[b.dataset.m]; }
  else if (b.dataset.cat) { cat = +b.dataset.cat; document.getElementById('c'+cat).scrollIntoView({behavior:'smooth'}); }
  else if (b.id==='opencart') return openSheet();
  else if (b.id==='newo') { myOrder = null; cart = {}; note=''; }
  else return;
  const y = window.scrollY; renderPhone(); window.scrollTo(0,y);
});

const sheetbg = document.getElementById('sheetbg'), sheet = document.getElementById('sheet');
function openSheet() {
  sheet.innerHTML = '<button class="close" id="cl">×</button><h3>Siparişiniz</h3>' +
    Object.entries(cart).map(([id,q])=>{ const it = ALL.find(x=>x.id==id); return '<div class="line"><span>'+q+' × '+it.ad+'</span><b>'+TL(it.f*q)+'</b></div>'; }).join('') +
    '<textarea id="note" rows="2" placeholder="Siparişe not ekleyin (örn. acısız olsun)">'+esc(note)+'</textarea>' +
    '<div class="pay"><button data-pay="Masada öde" class="'+(pay==='Masada öde'?'on':'')+'">💵 Masada öde</button><button data-pay="Kartla öde" class="'+(pay==='Kartla öde'?'on':'')+'">💳 Şimdi kartla öde</button></div>' +
    '<div class="tot"><span>Toplam</span><span>'+TL(total())+'</span></div>' +
    '<button class="go" id="send">Siparişi gönder</button>' +
    '<p style="font-size:12px;color:var(--muted);text-align:center;margin-top:10px">Demo: kartla ödeme iyzico / PayTR gibi altyapıya bağlanabilir.</p>';
  sheetbg.classList.add('open');
}
sheetbg.addEventListener('click', e => {
  if (e.target===sheetbg || e.target.id==='cl') { note = (document.getElementById('note')||{}).value || note; return sheetbg.classList.remove('open'); }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.pay) { note = document.getElementById('note').value; pay = b.dataset.pay; openSheet(); }
  if (b.id==='send') {
    note = document.getElementById('note').value;
    const o = { id:Date.now(), no: (orders.length ? Math.max(...orders.map(x=>x.no)) : 100) + 1, mode, pay, note,
      lines:Object.entries(cart).map(([id,q])=>({ad:ALL.find(x=>x.id==id).ad,q})), total:total(), durum:0, t:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}) };
    orders.push(o); save(orders); myOrder = o.id; sheetbg.classList.remove('open'); renderPhone(); window.scrollTo(0,0);
  }
});
function renderTrack() {
  const o = orders.find(x=>x.id===myOrder); if (!o) { myOrder = null; return renderPhone(); }
  const steps = ['Alındı','Hazırlanıyor','Hazır'];
  const msg = ['Siparişiniz mutfağa iletildi.','Şefimiz siparişinizi hazırlıyor.','Siparişiniz hazır! Afiyet olsun.'][o.durum];
  phone.innerHTML = '<div class="hd"><h1>Lokanta Sofra</h1><p>Sipariş #'+o.no+' · '+o.mode+'</p></div>' +
    '<div class="track"><div class="big">'+['📨','👨‍🍳','✅'][o.durum]+'</div><h2 style="margin-top:8px">'+steps[o.durum]+'</h2><p style="color:var(--muted)">'+msg+'</p>' +
    '<div class="prog">'+steps.map((s,i)=>'<div class="pg '+(i<o.durum?'done':i===o.durum?'now':'')+'"><i>'+(i<=o.durum?'✓':'')+'</i>'+s+'</div>').join('')+'</div>' +
    '<div style="text-align:left;margin-top:22px;background:#fff;border-radius:16px;padding:14px 16px">' + o.lines.map(l=>'<div class="line"><span>'+l.q+' × '+l.ad+'</span></div>').join('') +
    '<div class="tot"><span>Toplam · '+esc(o.pay)+'</span><span>'+TL(o.total)+'</span></div></div>' +
    '<button class="add" id="newo" style="margin-top:20px">Yeni sipariş ver</button>' +
    '<p style="font-size:12.5px;color:var(--muted);margin-top:14px">Durum otomatik güncellenir. Mutfak ekranından ilerletince burada değişir.</p></div>';
}

// MUTFAK
function renderKitchen() {
  const names = ['Yeni','Hazırlanıyor','Hazır'];
  document.getElementById('cols').innerHTML = names.map((n,d)=> {
    const list = orders.filter(o=>o.durum===d);
    return '<div class="col"><h3><span>'+n+'</span><span>'+list.length+'</span></h3>' + (list.length ? list.map(o =>
      '<div class="ord"><div class="top"><span>#'+o.no+'</span><span class="tag">'+esc(o.mode)+'</span></div><small style="color:var(--muted)">'+o.t+' · '+esc(o.pay)+'</small><ul>'+o.lines.map(l=>'<li><b>'+l.q+'×</b> '+l.ad+'</li>').join('')+'</ul>' +
      (o.note?'<div class="note">📝 '+esc(o.note)+'</div>':'') +
      (d<2 ? '<button data-adv="'+o.id+'">'+(d===0?'Hazırlamaya başla':'Hazır, servise ver')+'</button>' : '') + '</div>').join('') : '<div class="emptyc">Sipariş yok</div>') + '</div>';
  }).join('');
}
document.getElementById('cols').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const o = orders.find(x=>x.id==b.dataset.adv); if (!o) return;
  o.durum++; save(orders); renderKitchen();
});
document.getElementById('reset').addEventListener('click', () => { orders = []; save(orders); myOrder = null; renderKitchen(); });

function show(v) {
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  document.getElementById('musteri').hidden = v!=='musteri'; document.getElementById('mutfak').hidden = v!=='mutfak';
  orders = load(); if (v==='mutfak') renderKitchen(); else renderPhone();
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
window.addEventListener('storage', () => { orders = load(); if (!document.getElementById('mutfak').hidden) renderKitchen(); else if (myOrder) renderPhone(); });
renderPhone();
</script>
</body>
</html>
