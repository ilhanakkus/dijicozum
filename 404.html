<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı | DijiÇözüm</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logo/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="/assets/style.css?v=d0e2ab8d">
</head>
<body>
  <main class="wrap" style="min-height:100vh;display:grid;place-content:center;text-align:center;gap:16px">
    <img src="/assets/logo/logo-a.svg" alt="DijiÇözüm" width="200" height="44" style="margin:0 auto">
    <h1 style="font-size:72px;color:var(--brand)">404</h1>
    <p class="lead" style="margin:0 auto">Aradığınız sayfa bulunamadı.</p>
    <p><a class="btn btn-primary" href="/">Ana sayfaya dön</a></p>
  </main>
<div class="wa-widget">
  <div class="wa-panel" id="wa-panel" hidden>
    <div class="wa-panel-head">
      <img src="/assets/logo/icon.svg" alt="" class="wa-panel-avatar">
      <div><b>İlhan Akkuş</b><span>DijiÇözüm · genelde hemen yanıtlar</span></div>
      <button type="button" class="wa-panel-close" id="wa-close" aria-label="Kapat">&times;</button>
    </div>
    <div class="wa-panel-body"><div class="wa-bubble">Merhaba 👋<br>Size nasıl yardımcı olabiliriz?</div></div>
    <form class="wa-panel-form" id="wa-form">
      <textarea id="wa-text" aria-label="Mesajınız">Merhaba, web sitenizden yazıyorum.</textarea>
      <button type="submit" class="wa-send" aria-label="Gönder">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
      </button>
    </form>
  </div>
  <button type="button" class="wa-float" id="wa-toggle" aria-label="WhatsApp'tan yazın"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.81L2 22l5.42-1.36a9.9 9.9 0 0 0 4.62 1.14h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0 0 12.04 2zm5.8 14.02c-.24.68-1.4 1.32-1.93 1.4-.5.08-1.11.11-1.79-.11-.41-.13-.94-.31-1.62-.6-2.85-1.23-4.71-4.1-4.85-4.29-.14-.19-1.16-1.54-1.16-2.94s.73-2.09.99-2.37c.26-.29.56-.36.75-.36l.53.01c.17.01.4-.06.62.48.24.58.81 2 .88 2.14.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.14-.28.29-.12.57.16.29.71 1.19 1.53 1.93 1.05.95 1.94 1.25 2.22 1.39.28.14.45.12.62-.07.17-.19.71-.83.9-1.12.19-.28.38-.24.63-.14.26.09 1.65.79 1.93.93.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg></button>
</div>
<script>(function(){
  var btn=document.getElementById('wa-toggle'),panel=document.getElementById('wa-panel'),
      closeBtn=document.getElementById('wa-close'),form=document.getElementById('wa-form'),text=document.getElementById('wa-text');
  function open(){panel.hidden=false;text.focus();text.select();}
  function close(){panel.hidden=true;}
  btn.addEventListener('click',function(){panel.hidden?open():close();});
  closeBtn.addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
  document.addEventListener('click',function(e){if(!panel.hidden&&!panel.contains(e.target)&&!btn.contains(e.target))close();});
  text.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var msg=text.value.trim()||'Merhaba, web sitenizden yazıyorum.';
    if(window.dcTrack)dcTrack('whatsapp_click',{page:location.pathname});
    var mobil=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    var url=mobil?'https://wa.me/905451579311?text=':'https://web.whatsapp.com/send?phone=905451579311&text=';
    location.href=url+encodeURIComponent(msg);
  });
})();</script>
<script src="/assets/consent.js" defer></script>
</body>
</html>
